name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install current Codex CLI for schema validation
        run: npm install --global @openai/codex@latest
      - name: Bash syntax
        run: find scripts shared/hooks -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Build
        run: REQUIRE_CODEX_SCHEMA=true ./scripts/build.sh --summary
      - name: Doctor
        run: ./scripts/doctor.sh --summary
      - name: Platform package tests
        run: ./scripts/test-platform-packages.sh --summary
      - name: Managed manifest tests
        run: ./scripts/test-managed-install.sh --summary
      - name: Build validation tests
        run: ./scripts/test-build-validation.sh --summary
      - name: Install guard tests
        run: ./scripts/test-install-guards.sh --summary
      - name: Plugin selection tests
        run: ./scripts/test-plugin-selection.sh --summary
      - name: Install dry run
        run: |
          export HOME="$RUNNER_TEMP/isolated-home"
          mkdir -p "$HOME"
          ./scripts/install.sh --summary --dry-run --client both --platform linux
      - name: Update dry run
        run: |
          export HOME="$RUNNER_TEMP/isolated-home"
          mkdir -p "$HOME"
          ./scripts/update.sh --summary --dry-run --client both --platform linux

